openapi: 3.0.3
info:
  title: Orquestrator API
  version: 0.1.0
  description: Board, flows and agent orchestration. Source of truth for the Go server and the TS client.
servers:
  - url: /api
paths:
  /lanes:
    get:
      operationId: listLanes
      tags: [lanes]
      responses:
        "200":
          description: All lanes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Lane" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createLane
      tags: [lanes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaneInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lane" }
        default: { $ref: "#/components/responses/Error" }
  /lanes/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getLane
      tags: [lanes]
      responses:
        "200":
          description: The Lane.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lane" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateLane
      tags: [lanes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaneInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lane" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteLane
      tags: [lanes]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }
  /lanes/{id}/move:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: moveLane
      tags: [lanes]
      description: Moves the lane to a position of the board. Positions past the end move it to the end.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaneMove" }
      responses:
        "200":
          description: Moved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lane" }
        default: { $ref: "#/components/responses/Error" }
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      responses:
        "200":
          description: All projects.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getProject
      tags: [projects]
      responses:
        "200":
          description: The Project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProject
      tags: [projects]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }
  /card-types:
    get:
      operationId: listCardTypes
      tags: [card-types]
      responses:
        "200":
          description: All card-types.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CardType" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createCardType
      tags: [card-types]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardTypeInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardType" }
        default: { $ref: "#/components/responses/Error" }
  /card-types/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getCardType
      tags: [card-types]
      responses:
        "200":
          description: The CardType.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardType" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateCardType
      tags: [card-types]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardTypeInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardType" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCardType
      tags: [card-types]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }
  /cards:
    get:
      operationId: listCards
      tags: [cards]
      responses:
        "200":
          description: All cards.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Card" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createCard
      tags: [cards]
      description: Adds the card to the end of a lane.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewCard" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        default: { $ref: "#/components/responses/Error" }
  /cards/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getCard
      tags: [cards]
      responses:
        "200":
          description: The Card.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateCard
      tags: [cards]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCard
      tags: [cards]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }
  /cards/{id}/move:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: moveCard
      tags: [cards]
      description: Places the card at a position of a lane. Positions past the end place it at the end.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardMove" }
      responses:
        "200":
          description: Moved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        default: { $ref: "#/components/responses/Error" }
  /cards/{id}/children:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listChildCards
      tags: [cards]
      responses:
        "200":
          description: The children of the card.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Card" }
        default: { $ref: "#/components/responses/Error" }
  /cards/{id}/events:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listCardEvents
      tags: [cards]
      responses:
        "200":
          description: The card timeline, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CardEvent" }
        default: { $ref: "#/components/responses/Error" }
  /flows:
    get:
      operationId: listFlows
      tags: [flows]
      responses:
        "200":
          description: All flows, without their drafts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FlowSummary" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createFlow
      tags: [flows]
      description: Creates a disabled flow whose draft holds a single trigger.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewFlow" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flow" }
        default: { $ref: "#/components/responses/Error" }
  /flows/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getFlow
      tags: [flows]
      responses:
        "200":
          description: The flow, its draft and the problems of the draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flow" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateFlow
      tags: [flows]
      description: Renames the flow and turns it on or off. Only published flows can be enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlowInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flow" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteFlow
      tags: [flows]
      responses:
        "204":
          description: Deleted, with its versions.
        default: { $ref: "#/components/responses/Error" }
  /flows/{id}/draft:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: saveFlowDraft
      tags: [flows]
      description: Replaces the draft. Drafts may be incomplete; their problems come back in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlowGraph" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flow" }
        default: { $ref: "#/components/responses/Error" }
  /flows/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: publishFlow
      tags: [flows]
      description: Freezes the draft into the next version. Fails with invalid_graph when the draft has problems.
      responses:
        "201":
          description: Published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowVersion" }
        default: { $ref: "#/components/responses/Error" }
  /flows/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listFlowVersions
      tags: [flows]
      responses:
        "200":
          description: The published versions, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FlowVersion" }
        default: { $ref: "#/components/responses/Error" }
  /flow-runs/latest:
    get:
      operationId: listLatestFlowRuns
      tags: [runs]
      responses:
        "200":
          description: >
            One run per card that ever ran a flow: an active one if there is
            any, else the last one.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FlowRun" }
        default: { $ref: "#/components/responses/Error" }
  /agent-profiles:
    get:
      operationId: listAgentProfiles
      tags: [agent-profiles]
      responses:
        "200":
          description: All agent-profiles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentProfile" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAgentProfile
      tags: [agent-profiles]
      description: Creates a profile without credential; log it in with `orquestrator agent login claude --profile <name>`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentProfileInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentProfile" }
        default: { $ref: "#/components/responses/Error" }
  /agent-profiles/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getAgentProfile
      tags: [agent-profiles]
      responses:
        "200":
          description: The AgentProfile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentProfile" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateAgentProfile
      tags: [agent-profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentProfileInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentProfile" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAgentProfile
      tags: [agent-profiles]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }
  /mcp-servers:
    get:
      operationId: listMcpServers
      tags: [mcp-servers]
      responses:
        "200":
          description: All mcp-servers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/McpServer" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createMcpServer
      tags: [mcp-servers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpServerInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpServer" }
        default: { $ref: "#/components/responses/Error" }
  /mcp-servers/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getMcpServer
      tags: [mcp-servers]
      responses:
        "200":
          description: The McpServer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpServer" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateMcpServer
      tags: [mcp-servers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpServerInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpServer" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMcpServer
      tags: [mcp-servers]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }
  /events:
    get:
      operationId: streamEvents
      tags: [events]
      description: >
        Server-Sent Events with every change to the board. Each message has the
        event type as `event` and a BoardEvent as `data`. Implemented by hand
        (excluded from code generation).
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/BoardEvent" }

components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [bad_request, validation, not_found, conflict, in_use, invalid_reference, invalid_graph, card_busy, internal]
        message: { type: string }
        field:
          type: string
          description: Invalid field, for validation errors.
        problems:
          type: array
          description: What prevents publishing, for invalid_graph errors.
          items: { $ref: "#/components/schemas/GraphProblem" }
    Color:
      type: string
      description: Empty or "#rrggbb".
      example: "#3b82f6"
    Lane:
      type: object
      required: [id, name, color, position, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { $ref: "#/components/schemas/Color" }
        position: { type: integer }
        created_at: { type: string, format: date-time }
    LaneInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        color: { $ref: "#/components/schemas/Color" }
    LaneMove:
      type: object
      required: [position]
      properties:
        position: { type: integer, minimum: 0 }
    Project:
      type: object
      required: [id, name, source_kind, local_path, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        source_kind:
          type: string
          enum: [local]
        local_path:
          type: string
          description: Root of a git repository on the worker host.
        created_at: { type: string, format: date-time }
    ProjectInput:
      type: object
      required: [name, local_path]
      properties:
        name: { type: string }
        local_path:
          type: string
          description: Absolute path inside a git repository; stored as the repository root.
    CardType:
      type: object
      required: [id, name, color, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { $ref: "#/components/schemas/Color" }
        created_at: { type: string, format: date-time }
    CardTypeInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        color: { $ref: "#/components/schemas/Color" }
    Card:
      type: object
      required: [id, title, description, card_type_id, project_id, parent_card_id, lane_id, position, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        card_type_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, nullable: true }
        parent_card_id: { type: string, format: uuid, nullable: true }
        lane_id: { type: string, format: uuid }
        position: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CardInput:
      type: object
      required: [title, card_type_id]
      properties:
        title: { type: string }
        description: { type: string }
        card_type_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, nullable: true }
    NewCard:
      type: object
      required: [title, card_type_id, lane_id]
      properties:
        title: { type: string }
        description: { type: string }
        card_type_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, nullable: true }
        lane_id: { type: string, format: uuid }
        parent_card_id: { type: string, format: uuid, nullable: true }
    CardMove:
      type: object
      required: [lane_id, position]
      properties:
        lane_id: { type: string, format: uuid }
        position: { type: integer, minimum: 0 }
    CardEvent:
      type: object
      required: [id, card_id, type, payload, created_at]
      properties:
        id: { type: string, format: uuid }
        card_id: { type: string, format: uuid }
        type:
          type: string
          example: card.moved
        payload:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
    BoardEvent:
      type: object
      description: >
        A change to the board. `type` is "<entity>.<change>", with entity one of
        lane, project, card_type, card, flow, agent_profile, mcp_server,
        flow_run, card_event and change one of created,
        updated, moved, deleted, published.
      required: [type, id]
      properties:
        type:
          type: string
          example: card.moved
        id:
          type: string
          format: uuid
          description: Id of the changed entity.
        data:
          type: object
          additionalProperties: true
          description: The entity after the change; absent when it was deleted.
    FlowRun:
      type: object
      description: A run of a flow for a card.
      required: [id, flow_id, flow_version_id, flow_name, card_id, trigger, status, error, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        flow_id: { type: string, format: uuid }
        flow_version_id: { type: string, format: uuid }
        flow_name: { type: string }
        card_id: { type: string, format: uuid }
        trigger:
          type: string
          enum: [card_created, card_entered_lane]
        status:
          type: string
          enum: [running, waiting, done, failed, canceled]
          description: While running or waiting, the card can only be moved by the flow.
        error:
          type: string
          description: Why the run failed; empty otherwise.
        started_at: { type: string, format: date-time }
        finished_at:
          type: string
          format: date-time
          nullable: true
    FlowSummary:
      type: object
      required: [id, name, enabled, latest_version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        enabled:
          type: boolean
          description: Whether the latest version starts runs for cards.
        latest_version:
          type: integer
          description: Number of the last published version; 0 if never published.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Flow:
      allOf:
        - $ref: "#/components/schemas/FlowSummary"
        - type: object
          required: [draft, problems]
          properties:
            draft: { $ref: "#/components/schemas/FlowGraph" }
            problems:
              type: array
              description: What prevents publishing the draft; empty when it can be published.
              items: { $ref: "#/components/schemas/GraphProblem" }
    NewFlow:
      type: object
      required: [name]
      properties:
        name: { type: string }
    FlowInput:
      type: object
      required: [name, enabled]
      properties:
        name: { type: string }
        enabled: { type: boolean }
    FlowVersion:
      type: object
      required: [id, flow_id, version, graph, published_at]
      properties:
        id: { type: string, format: uuid }
        flow_id: { type: string, format: uuid }
        version: { type: integer }
        graph: { $ref: "#/components/schemas/FlowGraph" }
        published_at: { type: string, format: date-time }
    GraphProblem:
      type: object
      required: [message]
      properties:
        node_id: { type: string }
        edge_id: { type: string }
        message: { type: string }
    FlowGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/FlowNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/FlowEdge" }
    FlowEdge:
      type: object
      description: Connects an output (source_handle) of a node to another node.
      required: [id, source, source_handle, target]
      properties:
        id: { type: string }
        source: { type: string }
        source_handle:
          type: string
          description: >
            Output of the source node: trigger and move_card have "next";
            agent has "done" and "failed"; review has "approved",
            "changes_requested" and "max_rounds_exceeded"; end has none.
        target: { type: string }
    Position:
      type: object
      required: [x, y]
      properties:
        x: { type: number }
        y: { type: number }
    FlowNode:
      description: >
        A step of the flow. Configs may be incomplete in drafts; publishing
        reports what is missing.
      oneOf:
        - $ref: "#/components/schemas/TriggerNode"
        - $ref: "#/components/schemas/AgentNode"
        - $ref: "#/components/schemas/ReviewNode"
        - $ref: "#/components/schemas/MoveCardNode"
        - $ref: "#/components/schemas/EndNode"
      discriminator:
        propertyName: type
        mapping:
          trigger: "#/components/schemas/TriggerNode"
          agent: "#/components/schemas/AgentNode"
          review: "#/components/schemas/ReviewNode"
          move_card: "#/components/schemas/MoveCardNode"
          end: "#/components/schemas/EndNode"
    TriggerNode:
      type: object
      required: [id, type, position, config]
      properties:
        id: { type: string }
        type: { type: string, enum: [trigger] }
        position: { $ref: "#/components/schemas/Position" }
        config: { $ref: "#/components/schemas/TriggerConfig" }
    AgentNode:
      type: object
      required: [id, type, position, config]
      properties:
        id: { type: string }
        type: { type: string, enum: [agent] }
        position: { $ref: "#/components/schemas/Position" }
        config: { $ref: "#/components/schemas/AgentConfig" }
    ReviewNode:
      type: object
      required: [id, type, position, config]
      properties:
        id: { type: string }
        type: { type: string, enum: [review] }
        position: { $ref: "#/components/schemas/Position" }
        config: { $ref: "#/components/schemas/ReviewConfig" }
    MoveCardNode:
      type: object
      required: [id, type, position, config]
      properties:
        id: { type: string }
        type: { type: string, enum: [move_card] }
        position: { $ref: "#/components/schemas/Position" }
        config: { $ref: "#/components/schemas/MoveCardConfig" }
    EndNode:
      type: object
      required: [id, type, position, config]
      properties:
        id: { type: string }
        type: { type: string, enum: [end] }
        position: { $ref: "#/components/schemas/Position" }
        config:
          type: object
          additionalProperties: false
    TriggerConfig:
      type: object
      description: Starts the flow when a card is created or enters a lane, optionally only for some card types.
      properties:
        event:
          type: string
          enum: [card_created, card_entered_lane]
        lane_id:
          type: string
          format: uuid
          description: Required for card_entered_lane.
        card_type_ids:
          type: array
          description: Card types that start the flow; empty or absent means all.
          items: { type: string, format: uuid }
    AgentConfig:
      type: object
      description: Runs an agent session on the card's workspace.
      properties:
        profile_id:
          type: string
          format: uuid
          description: Agent profile the node runs as. Required to publish.
        mcp_server_ids:
          type: array
          description: External MCP servers available to the agent.
          items: { type: string, format: uuid }
        prompt:
          type: string
          description: Initial prompt. Required to publish.
        allowed_tools:
          type: array
          items: { type: string }
        disallowed_tools:
          type: array
          items: { type: string }
        output_schema:
          type: object
          additionalProperties: true
          nullable: true
          description: JSON Schema the agent's structured output must satisfy.
        max_turns:
          type: integer
          minimum: 1
        model:
          type: string
    ReviewConfig:
      type: object
      description: Runs a reviewer on the work of the previous agent.
      properties:
        profile_id:
          type: string
          format: uuid
          description: Agent profile the reviewer runs as. Required to publish.
        prompt:
          type: string
          description: Review prompt. Required to publish.
        allowed_tools:
          type: array
          items: { type: string }
        disallowed_tools:
          type: array
          items: { type: string }
        max_rounds:
          type: integer
          minimum: 1
          description: Rounds of changes before the max_rounds_exceeded output. Required to publish.
    MoveCardConfig:
      type: object
      description: Moves the card to a lane.
      properties:
        lane_id:
          type: string
          format: uuid
          description: Required to publish.
    AgentProfile:
      type: object
      required: [id, kind, name, ready, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [claude] }
        name: { type: string }
        ready:
          type: boolean
          description: Whether the profile has a credential.
        credential_kind:
          type: string
          enum: [oauth_token, api_key]
          description: Absent until the profile is logged in.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AgentProfileInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
    McpServer:
      type: object
      description: An external MCP server. Secret values are never returned, only their names.
      required: [id, name, transport, args, env, headers, secret_names, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        transport: { type: string, enum: [stdio, http] }
        command: { type: string }
        args:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        url: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        secret_names:
          type: array
          description: Env vars (stdio) or headers (http) whose values are stored encrypted.
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    McpServerInput:
      type: object
      required: [name, transport]
      properties:
        name: { type: string }
        transport: { type: string, enum: [stdio, http] }
        command:
          type: string
          description: Required for stdio.
        args:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        url:
          type: string
          description: Required for http.
        headers:
          type: object
          additionalProperties: { type: string }
        secrets:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: >
            Secret env vars (stdio) or headers (http), stored encrypted. On
            updates, absent or null keeps the current secrets; an object
            replaces them all.
