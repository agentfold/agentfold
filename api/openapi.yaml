openapi: 3.0.3
info:
  title: Orquestrator API
  version: 0.1.0
  description: Board, flows and agent orchestration. Source of truth for the Go server and the TS client.
servers:
  - url: /api
paths:
  /lanes:
    get:
      operationId: listLanes
      tags: [lanes]
      responses:
        "200":
          description: All lanes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Lane" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createLane
      tags: [lanes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaneInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lane" }
        default: { $ref: "#/components/responses/Error" }
  /lanes/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getLane
      tags: [lanes]
      responses:
        "200":
          description: The Lane.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lane" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateLane
      tags: [lanes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaneInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lane" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteLane
      tags: [lanes]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }
  /lanes/{id}/move:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: moveLane
      tags: [lanes]
      description: Moves the lane to a position of the board. Positions past the end move it to the end.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaneMove" }
      responses:
        "200":
          description: Moved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lane" }
        default: { $ref: "#/components/responses/Error" }
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      responses:
        "200":
          description: All projects.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getProject
      tags: [projects]
      responses:
        "200":
          description: The Project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProject
      tags: [projects]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }
  /card-types:
    get:
      operationId: listCardTypes
      tags: [card-types]
      responses:
        "200":
          description: All card-types.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CardType" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createCardType
      tags: [card-types]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardTypeInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardType" }
        default: { $ref: "#/components/responses/Error" }
  /card-types/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getCardType
      tags: [card-types]
      responses:
        "200":
          description: The CardType.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardType" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateCardType
      tags: [card-types]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardTypeInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardType" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCardType
      tags: [card-types]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }
  /cards:
    get:
      operationId: listCards
      tags: [cards]
      responses:
        "200":
          description: All cards.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Card" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createCard
      tags: [cards]
      description: Adds the card to the end of a lane.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewCard" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        default: { $ref: "#/components/responses/Error" }
  /cards/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getCard
      tags: [cards]
      responses:
        "200":
          description: The Card.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateCard
      tags: [cards]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCard
      tags: [cards]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }
  /cards/{id}/move:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: moveCard
      tags: [cards]
      description: Places the card at a position of a lane. Positions past the end place it at the end.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardMove" }
      responses:
        "200":
          description: Moved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        default: { $ref: "#/components/responses/Error" }
  /cards/{id}/children:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listChildCards
      tags: [cards]
      responses:
        "200":
          description: The children of the card.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Card" }
        default: { $ref: "#/components/responses/Error" }
  /cards/{id}/events:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listCardEvents
      tags: [cards]
      responses:
        "200":
          description: The card timeline, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CardEvent" }
        default: { $ref: "#/components/responses/Error" }
  /cards/{id}/questions:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listCardQuestions
      tags: [questions]
      responses:
        "200":
          description: The questions agents asked on the card, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Question" }
        default: { $ref: "#/components/responses/Error" }
  /questions/{id}/answer:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: answerQuestion
      tags: [questions]
      description: >
        Answers a question. Once every question its agent asked is answered,
        the agent resumes with the answers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionAnswer" }
      responses:
        "200":
          description: Answered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        default: { $ref: "#/components/responses/Error" }
  /flows:
    get:
      operationId: listFlows
      tags: [flows]
      responses:
        "200":
          description: All flows, without their drafts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FlowSummary" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createFlow
      tags: [flows]
      description: Creates a disabled flow whose draft holds a single trigger.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewFlow" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flow" }
        default: { $ref: "#/components/responses/Error" }
  /flows/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getFlow
      tags: [flows]
      responses:
        "200":
          description: The flow, its draft and the problems of the draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flow" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateFlow
      tags: [flows]
      description: Renames the flow and turns it on or off. Only published flows can be enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlowInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flow" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteFlow
      tags: [flows]
      responses:
        "204":
          description: Deleted, with its versions.
        default: { $ref: "#/components/responses/Error" }
  /flows/{id}/draft:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: saveFlowDraft
      tags: [flows]
      description: Replaces the draft. Drafts may be incomplete; their problems come back in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlowGraph" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flow" }
        default: { $ref: "#/components/responses/Error" }
  /flows/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: publishFlow
      tags: [flows]
      description: Freezes the draft into the next version. Fails with invalid_graph when the draft has problems.
      responses:
        "201":
          description: Published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowVersion" }
        default: { $ref: "#/components/responses/Error" }
  /flows/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listFlowVersions
      tags: [flows]
      responses:
        "200":
          description: The published versions, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FlowVersion" }
        default: { $ref: "#/components/responses/Error" }
  /cards/{id}/runs:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listCardRuns
      tags: [runs]
      responses:
        "200":
          description: The flow runs of the card with their node runs, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FlowRunDetail" }
        default: { $ref: "#/components/responses/Error" }
  /flow-runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: cancelFlowRun
      tags: [runs]
      description: >
        Stops an active run and frees its card: its agents are interrupted and
        its open questions closed. 404 when the run is not active.
      responses:
        "200":
          description: Canceled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowRun" }
        default: { $ref: "#/components/responses/Error" }
  /node-runs/{id}/output:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listNodeOutput
      tags: [runs]
      responses:
        "200":
          description: What the agent did while running the node, in order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NodeOutput" }
        default: { $ref: "#/components/responses/Error" }
  /node-runs/{id}/review:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: decideApproval
      tags: [runs]
      description: >
        Decides the approval of the output a human_review node with subject
        output awaits: approved leaves by approved, handing on what the node
        received; changes_requested (message required) leaves by
        changes_requested with the message for the agent. Fails with
        review_closed when the node run awaits no decision.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecision" }
      responses:
        "200":
          description: Decided; the flow goes on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeRun" }
        default: { $ref: "#/components/responses/Error" }
  /cards/{id}/artifacts:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listCardArtifacts
      tags: [artifacts]
      responses:
        "200":
          description: The artifacts agents collected on the card, with their versions and review chats, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }
  /artifacts/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getArtifact
      tags: [artifacts]
      responses:
        "200":
          description: The artifact with its versions and review chat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }
  /artifacts/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: requestArtifactChanges
      tags: [artifacts]
      description: >
        Asks for changes in the review the artifact is under, on its latest
        version: the human_review node leaves by changes_requested, and the
        agent it leads to gets the request in its session. Fails with
        review_closed when no review awaits the artifact.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArtifactMessageInput" }
      responses:
        "201":
          description: Sent; the agent revises.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactMessage" }
        default: { $ref: "#/components/responses/Error" }
  /artifacts/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: approveArtifact
      tags: [artifacts]
      description: >
        Approves the review the artifact is under: the human_review node
        leaves by approved. Fails with review_closed when no review awaits
        the artifact.
      responses:
        "204":
          description: Approved; the flow goes on.
        default: { $ref: "#/components/responses/Error" }
  /flow-runs/latest:
    get:
      operationId: listLatestFlowRuns
      tags: [runs]
      responses:
        "200":
          description: >
            One run per card that ever ran a flow: an active one if there is
            any, else the last one.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FlowRun" }
        default: { $ref: "#/components/responses/Error" }
  /agent-profiles:
    get:
      operationId: listAgentProfiles
      tags: [agent-profiles]
      responses:
        "200":
          description: All agent-profiles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentProfile" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAgentProfile
      tags: [agent-profiles]
      description: Creates a profile without credential; log it in with `orquestrator agent login claude --profile <name>`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentProfileInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentProfile" }
        default: { $ref: "#/components/responses/Error" }
  /agent-profiles/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getAgentProfile
      tags: [agent-profiles]
      responses:
        "200":
          description: The AgentProfile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentProfile" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateAgentProfile
      tags: [agent-profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentProfileInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentProfile" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAgentProfile
      tags: [agent-profiles]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }
  /mcp-servers:
    get:
      operationId: listMcpServers
      tags: [mcp-servers]
      responses:
        "200":
          description: All mcp-servers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/McpServer" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createMcpServer
      tags: [mcp-servers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpServerInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpServer" }
        default: { $ref: "#/components/responses/Error" }
  /mcp-servers/test:
    post:
      operationId: testMcpServer
      tags: [mcp-servers]
      description: >
        Connects to an MCP server as typed in the form, lists its tools and
        optionally calls one. Failures to reach or use the server are a
        result with ok false, not an error. stdio commands run on the API
        host, outside the sandbox.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpServerTest" }
      responses:
        "200":
          description: The outcome of the test.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpServerTestResult" }
        default: { $ref: "#/components/responses/Error" }
  /mcp-servers/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getMcpServer
      tags: [mcp-servers]
      responses:
        "200":
          description: The McpServer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpServer" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateMcpServer
      tags: [mcp-servers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpServerInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpServer" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMcpServer
      tags: [mcp-servers]
      responses:
        "204":
          description: Deleted.
        default: { $ref: "#/components/responses/Error" }
  /events:
    get:
      operationId: streamEvents
      tags: [events]
      description: >
        Server-Sent Events with every change to the board. Each message has the
        event type as `event` and a BoardEvent as `data`. Implemented by hand
        (excluded from code generation).
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/BoardEvent" }

components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [bad_request, validation, not_found, conflict, in_use, invalid_reference, invalid_graph, card_busy, question_closed, review_closed, internal]
        message: { type: string }
        field:
          type: string
          description: Invalid field, for validation errors.
        problems:
          type: array
          description: What prevents publishing, for invalid_graph errors.
          items: { $ref: "#/components/schemas/GraphProblem" }
    Color:
      type: string
      description: Empty or "#rrggbb".
      example: "#3b82f6"
    Lane:
      type: object
      required: [id, name, color, position, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { $ref: "#/components/schemas/Color" }
        position: { type: integer }
        created_at: { type: string, format: date-time }
    LaneInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        color: { $ref: "#/components/schemas/Color" }
    LaneMove:
      type: object
      required: [position]
      properties:
        position: { type: integer, minimum: 0 }
    Project:
      type: object
      required: [id, name, source_kind, local_path, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        source_kind:
          type: string
          enum: [local]
        local_path:
          type: string
          description: Root of a git repository on the worker host.
        created_at: { type: string, format: date-time }
    ProjectInput:
      type: object
      required: [name, local_path]
      properties:
        name: { type: string }
        local_path:
          type: string
          description: Absolute path inside a git repository; stored as the repository root.
    CardType:
      type: object
      required: [id, name, color, initial_lane_id, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { $ref: "#/components/schemas/Color" }
        initial_lane_id:
          type: string
          format: uuid
          nullable: true
          description: The lane the tasks agents create of this type start in; without it agents cannot create tasks of the type.
        created_at: { type: string, format: date-time }
    CardTypeInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        color: { $ref: "#/components/schemas/Color" }
        initial_lane_id: { type: string, format: uuid, nullable: true }
    Card:
      type: object
      required: [id, title, description, card_type_id, project_id, parent_card_id, lane_id, position, properties, depends_on, canceled_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        card_type_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, nullable: true }
        parent_card_id: { type: string, format: uuid, nullable: true }
        lane_id: { type: string, format: uuid }
        position: { type: integer }
        properties:
          type: object
          description: Set by set_property nodes; check_property nodes check them on the cards in depends_on.
          additionalProperties: { type: string }
        depends_on:
          type: array
          description: The cards this card depends on.
          items: { type: string, format: uuid }
        canceled_at:
          type: string
          format: date-time
          nullable: true
          description: When the agent that created the card as a task canceled it; wait_children no longer counts it.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CardInput:
      type: object
      required: [title, card_type_id]
      properties:
        title: { type: string }
        description: { type: string }
        card_type_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, nullable: true }
    NewCard:
      type: object
      required: [title, card_type_id, lane_id]
      properties:
        title: { type: string }
        description: { type: string }
        card_type_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, nullable: true }
        lane_id: { type: string, format: uuid }
        parent_card_id: { type: string, format: uuid, nullable: true }
    CardMove:
      type: object
      required: [lane_id, position]
      properties:
        lane_id: { type: string, format: uuid }
        position: { type: integer, minimum: 0 }
    CardEvent:
      type: object
      required: [id, card_id, type, payload, created_at]
      properties:
        id: { type: string, format: uuid }
        card_id: { type: string, format: uuid }
        type:
          type: string
          example: card.moved
        payload:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
    BoardEvent:
      type: object
      description: >
        A change to the board. `type` is "<entity>.<change>", with entity one of
        lane, project, card_type, card, flow, agent_profile, mcp_server,
        flow_run, node_run, node_output (id is the node run; no data),
        card_event, question, artifact (no data) and change one of created,
        updated, moved, deleted, published.
      required: [type, id]
      properties:
        type:
          type: string
          example: card.moved
        id:
          type: string
          format: uuid
          description: Id of the changed entity.
        data:
          type: object
          additionalProperties: true
          description: The entity after the change; absent when it was deleted.
    ApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, changes_requested]
        message:
          type: string
          description: What to change; required with changes_requested.
    NodeRun:
      type: object
      description: One execution of a node within a flow run.
      required: [id, flow_run_id, node_key, node_type, iteration, status, output_handle, error, summary, decision, feedback, output, approval, input_message,
        tokens_in, tokens_out, cache_read, cache_write, cost_usd, turns, duration_ms, created_at, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        flow_run_id: { type: string, format: uuid }
        node_key: { type: string }
        node_type:
          type: string
          description: The type of the node in the flow version; empty if it is gone.
        iteration:
          type: integer
          description: How many times the run entered the node (gateway rejections re-enter agents).
        status:
          type: string
          enum: [queued, running, awaiting_input, waiting, awaiting_review, done, failed]
          description: waiting is a wait_children or check_property node; awaiting_review a human_review node.
        output_handle:
          type: string
          description: The output the node left through; empty while it runs.
        error: { type: string }
        summary:
          type: string
          description: What the agent reported with report_done.
        decision:
          type: string
          enum: ["", approved, rejected, changes_requested]
          description: >
            How a gateway node decided, or how a human decided an output
            approval; empty for other nodes and while it runs.
        feedback:
          type: string
          description: The reason of approve, the feedback of reject or the changes the human asked.
        approval:
          type: boolean
          description: A human_review node that approves the output of the node before.
        input_message:
          type: string
          description: What an approval node has the human approve (the output of the node before, as an agent gets it); empty for other nodes.
        output:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            The node output handed to the next node: the agent result, summary,
            structured output and gateway decision.
        tokens_in: { type: integer, format: int64 }
        tokens_out: { type: integer, format: int64 }
        cache_read: { type: integer, format: int64 }
        cache_write: { type: integer, format: int64 }
        cost_usd:
          type: number
          format: double
          description: As reported by Claude Code; an estimate with a subscription token.
        turns: { type: integer }
        duration_ms: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    FlowRunDetail:
      allOf:
        - $ref: "#/components/schemas/FlowRun"
        - type: object
          required: [nodes]
          properties:
            nodes:
              type: array
              items: { $ref: "#/components/schemas/NodeRun" }
    NodeOutput:
      type: object
      description: A step of what an agent did.
      required: [id, node_run_id, kind, text, tool, is_error, created_at]
      properties:
        id: { type: string, format: uuid }
        node_run_id: { type: string, format: uuid }
        kind:
          type: string
          enum: [text, tool_use, tool_result, result]
        text:
          type: string
          description: The message, or the tool input or result, shortened.
        tool:
          type: string
          description: The tool name of tool_use steps.
        is_error: { type: boolean }
        created_at: { type: string, format: date-time }
    Question:
      type: object
      description: Something an agent asked a human; its node waits for the answers.
      required: [id, card_id, node_run_id, text, answer, answered_at, delivered, created_at]
      properties:
        id: { type: string, format: uuid }
        card_id: { type: string, format: uuid }
        node_run_id: { type: string, format: uuid }
        text: { type: string }
        answer: { type: string, nullable: true }
        answered_at: { type: string, format: date-time, nullable: true }
        delivered:
          type: boolean
          description: Whether the answer already reached the agent; it can no longer change.
        created_at: { type: string, format: date-time }
    QuestionAnswer:
      type: object
      required: [answer]
      properties:
        answer: { type: string }
    FlowRun:
      type: object
      description: A run of a flow for a card.
      required: [id, flow_id, flow_version_id, flow_name, card_id, trigger, status, awaiting_review, error, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        flow_id: { type: string, format: uuid }
        flow_version_id: { type: string, format: uuid }
        flow_name: { type: string }
        awaiting_review:
          type: boolean
          description: A human_review node of the run awaits the human (the run is waiting).
        card_id: { type: string, format: uuid }
        trigger:
          type: string
          enum: [card_created, card_entered_lane, artifact_revision]
          description: artifact_revision runs revised an artifact before human_review nodes; no new ones start.
        status:
          type: string
          enum: [running, waiting, done, failed, canceled]
          description: While running or waiting, the card can only be moved by the flow.
        error:
          type: string
          description: Why the run failed; empty otherwise.
        started_at: { type: string, format: date-time }
        finished_at:
          type: string
          format: date-time
          nullable: true
    FlowSummary:
      type: object
      required: [id, name, enabled, latest_version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        enabled:
          type: boolean
          description: Whether the latest version starts runs for cards.
        latest_version:
          type: integer
          description: Number of the last published version; 0 if never published.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Flow:
      allOf:
        - $ref: "#/components/schemas/FlowSummary"
        - type: object
          required: [draft, problems]
          properties:
            draft: { $ref: "#/components/schemas/FlowGraph" }
            problems:
              type: array
              description: What prevents publishing the draft; empty when it can be published.
              items: { $ref: "#/components/schemas/GraphProblem" }
    NewFlow:
      type: object
      required: [name]
      properties:
        name: { type: string }
    FlowInput:
      type: object
      required: [name, enabled]
      properties:
        name: { type: string }
        enabled: { type: boolean }
    FlowVersion:
      type: object
      required: [id, flow_id, version, graph, published_at]
      properties:
        id: { type: string, format: uuid }
        flow_id: { type: string, format: uuid }
        version: { type: integer }
        graph: { $ref: "#/components/schemas/FlowGraph" }
        published_at: { type: string, format: date-time }
    GraphProblem:
      type: object
      required: [message]
      properties:
        node_id: { type: string }
        edge_id: { type: string }
        message: { type: string }
        warning:
          type: boolean
          description: Points out something likely wrong without preventing publishing.
    FlowGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/FlowNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/FlowEdge" }
    FlowEdge:
      type: object
      description: Connects an output (source_handle) of a node to another node.
      required: [id, source, source_handle, target]
      properties:
        id: { type: string }
        source: { type: string }
        source_handle:
          type: string
          description: >
            Output of the source node: trigger and move_card have "next";
            agent has "done" and "failed", or with the gateway on "approved",
            "rejected", "max_rounds_exceeded" and "failed"; create_cards has
            "next" and "failed"; wait_children has "all_done" and
            "some_failed"; human_review has "approved" and
            "changes_requested"; set_property has "next"; check_property
            has "satisfied" and "pending"; end has none.
        target: { type: string }
    Position:
      type: object
      required: [x, y]
      properties:
        x: { type: number }
        y: { type: number }
    FlowNode:
      description: >
        A step of the flow. Configs may be incomplete in drafts; publishing
        reports what is missing.
      oneOf:
        - $ref: "#/components/schemas/TriggerNode"
        - $ref: "#/components/schemas/AgentNode"
        - $ref: "#/components/schemas/MoveCardNode"
        - $ref: "#/components/schemas/CreateCardsNode"
        - $ref: "#/components/schemas/WaitChildrenNode"
        - $ref: "#/components/schemas/HumanReviewNode"
        - $ref: "#/components/schemas/SetPropertyNode"
        - $ref: "#/components/schemas/CheckPropertyNode"
        - $ref: "#/components/schemas/HTTPRequestNode"
        - $ref: "#/components/schemas/TransformNode"
        - $ref: "#/components/schemas/SwitchNode"
        - $ref: "#/components/schemas/EndNode"
      discriminator:
        propertyName: type
        mapping:
          trigger: "#/components/schemas/TriggerNode"
          agent: "#/components/schemas/AgentNode"
          move_card: "#/components/schemas/MoveCardNode"
          create_cards: "#/components/schemas/CreateCardsNode"
          wait_children: "#/components/schemas/WaitChildrenNode"
          human_review: "#/components/schemas/HumanReviewNode"
          set_property: "#/components/schemas/SetPropertyNode"
          check_property: "#/components/schemas/CheckPropertyNode"
          http_request: "#/components/schemas/HTTPRequestNode"
          transform: "#/components/schemas/TransformNode"
          switch: "#/components/schemas/SwitchNode"
          end: "#/components/schemas/EndNode"
    TriggerNode:
      type: object
      required: [id, type, position, config]
      properties:
        id: { type: string }
        type: { type: string, enum: [trigger] }
        position: { $ref: "#/components/schemas/Position" }
        config: { $ref: "#/components/schemas/TriggerConfig" }
    AgentNode:
      type: object
      required: [id, type, position, config]
      properties:
        id: { type: string }
        type: { type: string, enum: [agent] }
        position: { $ref: "#/components/schemas/Position" }
        config: { $ref: "#/components/schemas/AgentConfig" }
    MoveCardNode:
      type: object
      required: [id, type, position, config]
      properties:
        id: { type: string }
        type: { type: string, enum: [move_card] }
        position: { $ref: "#/components/schemas/Position" }
        config: { $ref: "#/components/schemas/MoveCardConfig" }
    CreateCardsNode:
      type: object
      required: [id, type, position, config]
      properties:
        id: { type: string }
        type: { type: string, enum: [create_cards] }
        position: { $ref: "#/components/schemas/Position" }
        config: { $ref: "#/components/schemas/CreateCardsConfig" }
    WaitChildrenNode:
      type: object
      required: [id, type, position, config]
      properties:
        id: { type: string }
        type: { type: string, enum: [wait_children] }
        position: { $ref: "#/components/schemas/Position" }
        config: { $ref: "#/components/schemas/WaitChildrenConfig" }
    HumanReviewNode:
      type: object
      required: [id, type, position, config]
      properties:
        id: { type: string }
        type: { type: string, enum: [human_review] }
        position: { $ref: "#/components/schemas/Position" }
        config: { $ref: "#/components/schemas/HumanReviewConfig" }
    SetPropertyNode:
      type: object
      required: [id, type, position, config]
      properties:
        id: { type: string }
        type: { type: string, enum: [set_property] }
        position: { $ref: "#/components/schemas/Position" }
        config: { $ref: "#/components/schemas/SetPropertyConfig" }
    CheckPropertyNode:
      type: object
      required: [id, type, position, config]
      properties:
        id: { type: string }
        type: { type: string, enum: [check_property] }
        position: { $ref: "#/components/schemas/Position" }
        config: { $ref: "#/components/schemas/CheckPropertyConfig" }
    HTTPRequestNode:
      type: object
      required: [id, type, position, config]
      properties:
        id: { type: string }
        type: { type: string, enum: [http_request] }
        position: { $ref: "#/components/schemas/Position" }
        config: { $ref: "#/components/schemas/HTTPRequestConfig" }
    TransformNode:
      type: object
      required: [id, type, position, config]
      properties:
        id: { type: string }
        type: { type: string, enum: [transform] }
        position: { $ref: "#/components/schemas/Position" }
        config: { $ref: "#/components/schemas/TransformConfig" }
    SwitchNode:
      type: object
      required: [id, type, position, config]
      properties:
        id: { type: string }
        type: { type: string, enum: [switch] }
        position: { $ref: "#/components/schemas/Position" }
        config: { $ref: "#/components/schemas/SwitchConfig" }
    EndNode:
      type: object
      required: [id, type, position, config]
      properties:
        id: { type: string }
        type: { type: string, enum: [end] }
        position: { $ref: "#/components/schemas/Position" }
        config:
          type: object
          additionalProperties: false
    TriggerConfig:
      type: object
      description: Starts the flow when a card is created or enters a lane, optionally only for some card types.
      properties:
        event:
          type: string
          enum: [card_created, card_entered_lane]
        lane_id:
          type: string
          format: uuid
          description: Required for card_entered_lane.
        card_type_ids:
          type: array
          description: Card types that start the flow; empty or absent means all.
          items: { type: string, format: uuid }
    AgentConfig:
      type: object
      description: Runs an agent session on the card's workspace.
      properties:
        profile_id:
          type: string
          format: uuid
          description: Agent profile the node runs as. Required to publish.
        mcp_server_ids:
          type: array
          description: External MCP servers available to the agent.
          items: { type: string, format: uuid }
        prompt:
          type: string
          description: >
            Initial prompt. Required to publish. Takes the placeholders of
            HTTPRequestConfig, filled in when the run enters the node;
            unknown ones stay as written.
        allowed_tools:
          type: array
          description: >
            Tools the agent may use. The board tools create_cards, list_cards,
            retry_card and cancel_card only exist when listed
            (mcp__orquestrator__<name>, or mcp__orquestrator for all).
          items: { type: string }
        card_type_ids:
          type: array
          description: >
            Card types the agent creates child cards of, with create_cards
            (in the initial lane of each type). Required to publish with
            create_cards listed.
          items: { type: string, format: uuid }
        disallowed_tools:
          type: array
          items: { type: string }
        output_schema:
          type: object
          additionalProperties: true
          nullable: true
          description: JSON Schema the agent's structured output must satisfy.
        max_turns:
          type: integer
          minimum: 1
        model:
          type: string
        read_only:
          type: boolean
          description: Blocks the editing tools, as for a reviewer.
        gateway:
          type: boolean
          description: >
            The agent decides with the approve or reject tools; the node outputs
            become approved, rejected, max_rounds_exceeded and failed.
        max_rounds:
          type: integer
          minimum: 1
          description: Rejections before the max_rounds_exceeded output. Required with the gateway on.
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/ArtifactSpec" }
    ArtifactSpec:
      type: object
      description: A file of the card workspace the node collects into the card when it finishes.
      required: [name, path]
      properties:
        name: { type: string }
        path:
          type: string
          description: Relative to the card workspace.
    Artifact:
      type: object
      description: >
        A file an agent node collected on the card, with its versions and review
        chat. A human_review node puts it under review.
      required: [id, card_id, name, review, versions, messages, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        card_id: { type: string, format: uuid }
        name: { type: string }
        review:
          type: string
          enum: [none, open, revising, approved, closed]
          description: >
            Where its last review stands: open awaits the human, who can ask
            for changes or approve; revising while the agent works on the
            request; closed when its run ended without approval.
        versions:
          type: array
          description: Oldest first.
          items: { $ref: "#/components/schemas/ArtifactVersion" }
        messages:
          type: array
          description: The review chat, oldest first.
          items: { $ref: "#/components/schemas/ArtifactMessage" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ArtifactVersion:
      type: object
      required: [version, path, content, node_run_id, created_at]
      properties:
        version: { type: integer }
        path: { type: string }
        content: { type: string }
        node_run_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    ArtifactMessage:
      type: object
      required: [id, artifact_id, version, role, text, node_run_id, created_at]
      properties:
        id: { type: string, format: uuid }
        artifact_id: { type: string, format: uuid }
        version:
          type: integer
          description: The version the human was reading, or the agent revised.
        role: { type: string, enum: [human, agent] }
        text: { type: string }
        node_run_id:
          type: string
          format: uuid
          nullable: true
          description: The human_review node run the human wrote at, or the agent answer reached.
        created_at: { type: string, format: date-time }
    ArtifactMessageInput:
      type: object
      required: [text]
      properties:
        text: { type: string }
    MoveCardConfig:
      type: object
      description: Moves the card to a lane.
      properties:
        lane_id:
          type: string
          format: uuid
          description: Required to publish.
    CreateCardsConfig:
      type: object
      description: >
        Retired: agents create child cards with the create_cards tool.
        Versions published with it still create a child card for each item
        of the "cards" list the node before hands on; drafts with it do not
        publish.
      properties:
        lane_id:
          type: string
          format: uuid
          description: Lane of the new cards. Required to publish.
        card_type_id:
          type: string
          format: uuid
          description: Type of the new cards. Required to publish.
    WaitChildrenConfig:
      type: object
      description: >
        Waits for the child cards that were not canceled: a child is done
        once it has the property property_key set to property_value (both
        required to publish), failed when its last run failed or was
        canceled before that. all_done when every child is done;
        some_failed as soon as one failed (mode all_succeed, the default)
        or once every child is done or failed (mode all_finished).
      properties:
        mode:
          type: string
          enum: [all_succeed, all_finished]
        property_key: { type: string }
        property_value: { type: string }
        done_lane_id:
          type: string
          format: uuid
          description: Versions published before properties tell a done child by this lane; no longer publishable.
    SetPropertyConfig:
      type: object
      description: Sets a property of the card. key and value are required to publish.
      properties:
        key: { type: string }
        value: { type: string }
    CheckPropertyConfig:
      type: object
      description: >
        Checks that every card the card depends on has the property key set
        to value: satisfied if so (or without dependencies), else pending.
        With wait on, the node waits until they do instead of leaving by
        pending. key and value are required to publish.
      properties:
        key: { type: string }
        value: { type: string }
        wait: { type: boolean }
    TransformConfig:
      type: object
      description: >
        Builds a JSON value without an agent and hands it on as
        {"output": <value>}, leaving by next. In output, strings starting
        with = are expr-lang expressions (https://expr-lang.org) whose
        values keep their type; other strings are text with the
        placeholders of HTTPRequestConfig. Expressions read card (its
        fields and properties), input (what the node before handed on: its
        structured output, else its text) and nodes (the same for the last
        output of each node of the run, as nodes.dev or nodes["agent-1"]).
        An expression that fails (a missing field, a wrong type) leaves by
        failed, handing on the input. output is required to publish.
      properties:
        output: {}
    SwitchConfig:
      type: object
      description: >
        Goes on by the output of the first case whose expression (expr-lang,
        reading card, input and nodes as in TransformConfig) is true, else
        by else, handing on the input. A condition that fails or is neither
        true nor false leaves by failed. Its outputs are the case names,
        else and failed. One case at least is required to publish; names
        take letters, digits, _ and -, are unique and not else or failed.
      properties:
        cases:
          type: array
          items: { $ref: "#/components/schemas/SwitchCase" }
    SwitchCase:
      type: object
      required: [name, expression]
      properties:
        name: { type: string }
        expression: { type: string }
    HTTPRequestConfig:
      type: object
      description: >
        Calls an HTTP endpoint. url, header values and body take
        placeholders: {{card.<field>}} (id, title, description, lane_id,
        card_type_id, project_id, parent_card_id),
        {{card.properties.<key>}}, {{input}} (what the node before handed
        on), {{input.<path>}} (a value in its structured output, by keys
        and array indexes split by dots), and {{nodes.<id>}} and
        {{nodes.<id>.<path>}} (the same for the last output of the node id
        in the run). Values are URL-encoded in the url
        and JSON-escaped in the body, which gets a JSON content type unless a
        header sets one. In wait mode (the default) the node leaves by
        success when the status is one of success_statuses (2xx when empty),
        else by failed, after max_attempts attempts for network errors,
        timeouts, 429 and 5xx; it hands on {"output": {"status", "body"}}.
        In fire_and_forget mode it makes one attempt and goes on by next
        right away, handing on its input. method and url are required to
        publish.
      properties:
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD]
        url: { type: string }
        headers:
          type: array
          items: { $ref: "#/components/schemas/HTTPHeader" }
        body: { type: string }
        mode:
          type: string
          enum: [wait, fire_and_forget]
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
          description: Bounds each attempt; 30 when absent.
        success_statuses:
          type: array
          items: { type: integer, minimum: 100, maximum: 599 }
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
          description: Attempts in wait mode; 1 when absent.
        retry_delay_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          description: Wait before the second attempt; 30 when absent.
        backoff:
          type: string
          enum: [fixed, exponential]
          description: exponential doubles the wait after each attempt, up to an hour.
    HTTPHeader:
      type: object
      required: [name]
      description: >
        A request header. Saving the draft seals the value of a secret
        header into sealed and clears value; send sealed back unchanged to
        keep it, or a new value to replace it.
      properties:
        name: { type: string }
        value: { type: string }
        secret: { type: boolean }
        sealed:
          type: string
          format: byte
          description: The encrypted value of a secret header.
    HumanReviewConfig:
      type: object
      description: >
        Waits for a human to review artifacts of the card (subject
        artifacts, the default) or to approve the output of the node before
        (subject output, without artifacts): they ask for changes or
        approve. changes_requested must lead to the node that redoes the
        work.
      properties:
        subject:
          type: string
          enum: [artifacts, output]
        artifacts:
          type: array
          description: Names of the artifacts reviewed; empty or absent means those collected in the run.
          items: { type: string }
    AgentProfile:
      type: object
      required: [id, kind, name, ready, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [claude, opencode]
          description: The agent CLI the profile runs.
        name: { type: string }
        ready:
          type: boolean
          description: Whether the profile has a credential.
        credential_kind:
          type: string
          enum: [oauth_token, api_key, opencode_auth]
          description: Absent until the profile is logged in.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AgentProfileInput:
      type: object
      required: [name]
      properties:
        kind:
          type: string
          enum: [claude, opencode]
          description: Read on creation only; claude when absent.
        name: { type: string }
    McpServer:
      type: object
      description: An external MCP server. Secret values are never returned, only their names.
      required: [id, name, transport, args, env, headers, secret_names, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        transport: { type: string, enum: [stdio, http] }
        command: { type: string }
        args:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        url: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        secret_names:
          type: array
          description: Env vars (stdio) or headers (http) whose values are stored encrypted.
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    McpServerTest:
      type: object
      required: [server]
      properties:
        server: { $ref: "#/components/schemas/McpServerInput" }
        server_id:
          type: string
          format: uuid
          description: The server being edited; its stored secrets are used when server.secrets is absent or null.
        tool:
          type: string
          description: A tool to call after listing them, to check what only a call checks (such as the token). It really runs.
        arguments:
          type: object
          additionalProperties: true
          description: The arguments of the tool call.
    McpServerTestResult:
      type: object
      required: [ok, tools]
      properties:
        ok: { type: boolean }
        tools:
          type: array
          description: The names of the tools the server lists.
          items: { type: string }
        error:
          type: string
          description: Why the test failed.
        tool_result:
          type: string
          description: The text the tool call returned, shortened.
    McpServerInput:
      type: object
      required: [name, transport]
      properties:
        name: { type: string }
        transport: { type: string, enum: [stdio, http] }
        command:
          type: string
          description: Required for stdio.
        args:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        url:
          type: string
          description: Required for http.
        headers:
          type: object
          additionalProperties: { type: string }
        secrets:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: >
            Secret env vars (stdio) or headers (http), stored encrypted. On
            updates, absent or null keeps the current secrets; an object
            replaces them all.
