# Postgres for local development: `mise run db:up`.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: orquestrator
      POSTGRES_USER: orquestrator
      POSTGRES_PASSWORD: orquestrator
    ports:
      - "${ORQ_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orquestrator -d orquestrator"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
